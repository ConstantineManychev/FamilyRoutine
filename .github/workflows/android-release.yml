name: Android release

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: HTTPS address of the server the app talks to
        required: false
        default: https://familyroutine.duckdns.org
      check_only:
        description: Only check that the APK builds, without signing secrets and without publishing
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  DEFAULT_API_URL: https://familyroutine.duckdns.org
  APK_DIR: frontend/dist

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Resolve server address and version
        id: meta
        env:
          INPUT_API_URL: ${{ inputs.api_url }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          url="${INPUT_API_URL:-$DEFAULT_API_URL}"
          url="${url%/}"
          if [[ ! "$url" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]]; then
            echo "::error::api_url must be an https origin without a path, for example https://familyroutine.duckdns.org"
            exit 1
          fi
          host="${url#https://}"
          host="${host%%:*}"

          version="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must look like v1.2.3, got $REF_NAME"
              exit 1
            fi
          fi

          {
            echo "url=$url"
            echo "host=$host"
            echo "version=$version"
            echo "build=$RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        if: inputs.check_only != true
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$KEYSTORE" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See README, section «Android-приложение»."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Write signing key
        if: inputs.check_only != true
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        env:
          API_URL: ${{ steps.meta.outputs.url }}
          BUILD_NAME: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build }}
          ORG_GRADLE_PROJECT_appLinkHost: ${{ steps.meta.outputs.host }}
        run: |
          flutter build apk --release \
            --dart-define=API_URL="$API_URL" \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Verify signature and collect APK
        if: inputs.check_only != true
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build }}
          API_URL: ${{ steps.meta.outputs.url }}
          APP_LINK_HOST: ${{ steps.meta.outputs.host }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "Using $apksigner"

          expected="$(keytool -exportcert -alias "$KEY_ALIAS" -keystore android/app/upload-keystore.jks -storepass:env STORE_PASSWORD | sha256sum | cut -d' ' -f1)"
          "$apksigner" verify --print-certs "$apk" > signature.txt
          cat signature.txt

          digests="$(grep -i 'sha-256 digest' signature.txt | grep -Eio '[0-9a-f]{64}' | tr 'A-F' 'a-f' || true)"
          if [[ -z "$digests" ]]; then
            echo "::error::apksigner did not report any signing certificate"
            exit 1
          fi
          if ! grep -qx "$expected" <<< "$digests"; then
            echo "::error::The APK is not signed with the key from ANDROID_KEYSTORE_BASE64 (alias ANDROID_KEY_ALIAS)"
            exit 1
          fi
          fingerprint="$(echo "$expected" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"

          mkdir -p dist
          name="family-routine-$VERSION-$BUILD_NUMBER.apk"
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")

          {
            echo "### Family Routine $VERSION ($BUILD_NUMBER)"
            echo
            echo "- Server: \`$API_URL\`"
            echo "- App Links host: \`$APP_LINK_HOST\`"
            echo "- Signing certificate SHA-256 for \`ANDROID_CERT_SHA256\`:"
            echo
            echo "\`\`\`"
            echo "$fingerprint"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing key
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        if: inputs.check_only != true
        with:
          name: family-routine-apk
          path: ${{ env.APK_DIR }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.ref_type == 'tag' && inputs.check_only != true
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_DIR }}/*
          generate_release_notes: true
