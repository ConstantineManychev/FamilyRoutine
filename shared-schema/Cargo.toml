[package]
name = "shared-schema"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.7", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["macros", "uuid", "chrono", "postgres", "rust_decimal"] }
rust_decimal = { version = "1", features = ["serde"] }
